server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config and the HTML shell must never be cached, so a changed
    # VITE_API_BASE_URL or a new build is picked up on the next page load.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Fingerprinted build assets can be cached aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths (e.g. /applications/h_x after refresh) load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
